name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Type check desktop application
        run: npm run typecheck

      - name: Run desktop tests
        run: npm test

      - name: Build desktop application
        run: npm run build

      - name: Test browser Show Me resolver
        run: npm --prefix browser-demo test

      - name: Build browser demo
        run: npm --prefix browser-demo run build
