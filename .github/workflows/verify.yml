name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Check portfolio writing
        run: node scripts/check-portfolio-writing.mjs

      - name: Type check desktop application
        run: npm run typecheck

      - name: Run desktop tests
        run: npm test

      - name: Build desktop application
        run: npm run build

      - name: Check browser API syntax
        run: node --check api/chat.js && node --check api/health.js

      - name: Test browser Show Me resolver
        run: npm --prefix browser-demo test

      - name: Build browser demo
        run: npm --prefix browser-demo run build

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --prefix browser-demo --no-save playwright@1.62.1

      - name: Install Chromium
        run: npm --prefix browser-demo exec -- playwright install chromium

      - name: Build browser demo for regression tests
        run: npm --prefix browser-demo run build

      - name: Run reviewed browser regressions
        run: node browser-demo/tests/local-browser.mjs

      - name: Wait for matching Vercel production deployment
        env:
          RETZA_DEMO_URL: https://retza-live-demo.vercel.app
          RETZA_EXPECTED_COMMIT: ${{ github.sha }}
        run: node browser-demo/tests/wait-for-production.mjs

      - name: Verify current Vercel production experience
        env:
          RETZA_DEMO_URL: https://retza-live-demo.vercel.app
        run: node browser-demo/tests/production-smoke.mjs
