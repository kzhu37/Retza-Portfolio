name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Type check desktop application
        run: npm run typecheck

      - name: Run desktop tests
        run: npm test

      - name: Build desktop application
        run: npm run build

      - name: Check browser API syntax
        run: node --check api/chat.js

      - name: Test browser Show Me resolver
        run: npm --prefix browser-demo test

      - name: Build browser demo
        run: npm --prefix browser-demo run build

  production-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --prefix browser-demo --no-save playwright@1.55.0

      - name: Install Chromium
        run: npm --prefix browser-demo exec -- playwright install chromium

      - name: Verify Vercel production experience
        env:
          RETZA_DEMO_URL: https://retza-portfolio-demo-xiangseanzhu-7370.vercel.app
        run: node browser-demo/tests/production-smoke.mjs
