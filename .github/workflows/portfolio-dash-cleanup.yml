name: Portfolio dash cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove long dashes across portfolio content'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove long dash characters from tracked text
        shell: python
        run: |
          import pathlib, subprocess

          self_path = pathlib.Path('.github/workflows/portfolio-dash-cleanup.yml')
          codes = (0x2010,0x2011,0x2012,0x2013,0x2014,0x2015,0x23AF,0x2500,0x2501,0x2504,0x2505,0x2508,0x2509,0x254C,0x254D,0x2550,0x2E3A,0x2E3B,0xFE58,0xFE63,0xFF0D)
          compact = {0x2010,0x2011,0x2012,0x2013,0x23AF,0x2500,0x2501,0x2504,0x2505,0x2508,0x2509,0x254C,0x254D,0x2550,0xFE63,0xFF0D}
          entities = {'&ndash;':'-','&mdash;':' - ','&#8211;':'-','&#8212;':' - ','&#x2013;':'-','&#x2014;':' - ','&#X2013;':'-','&#X2014;':' - '}
          code_exts = {'.c','.cc','.cpp','.cs','.css','.go','.h','.hpp','.html','.java','.js','.jsx','.mjs','.cjs','.php','.ps1','.py','.rb','.rs','.sh','.ts','.tsx','.vue','.svelte'}
          tracked = [pathlib.Path(p.decode()) for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]

          def is_test(p):
              parts = {x.lower() for x in p.parts}; n = p.name.lower()
              return bool(parts & {'test','tests','__tests__'}) or '.test.' in n or '.spec.' in n

          def contains_dash_literal_or_escape(line):
              return any(
                  chr(c) in line or f'\\u{c:04x}' in line or f'\\u{c:04X}' in line
                  for c in codes
              )

          def preserve(p, line):
              low = line.lower()
              if is_test(p): return True
              if p.suffix.lower() not in code_exts: return False
              if ('/[' in line or 'regexp(' in low) and contains_dash_literal_or_escape(line): return True
              return any(k in low for k in ('forbiddendash','dashpattern','dash_pattern','normalize','normalise','sanitiz','canonicaliz'))

          changed = []
          for p in tracked:
              if p == self_path: continue
              try: original = p.read_bytes().decode('utf-8')
              except (UnicodeDecodeError,OSError): continue
              out = []
              for line in original.splitlines(keepends=True):
                  if p.suffix.lower() in {'.yml','.yaml'} and 'grep ' in line and any(chr(c) in line for c in codes):
                      line = line.replace('grep -RInE','grep -RInP').replace('grep -InE','grep -InP')
                      for c in codes: line = line.replace(chr(c), f'\\x{{{c:04x}}}')
                  elif preserve(p,line):
                      for c in codes: line = line.replace(chr(c), f'\\u{c:04x}')
                  else:
                      for c in codes:
                          line = line.replace(f'\\u{c:04x}', '-' if c in compact else ' - ').replace(f'\\u{c:04X}', '-' if c in compact else ' - ')
                      for a,b in entities.items(): line = line.replace(a,b)
                      for c in codes: line = line.replace(chr(c), '-' if c in compact else ' - ')
                  out.append(line)
              text = ''.join(out)
              if text != original:
                  p.write_bytes(text.encode('utf-8')); changed.append(str(p))

          print('Changed files:')
          for p in changed: print(p)

          bad = []
          for p in tracked:
              if p == self_path: continue
              try: text = p.read_bytes().decode('utf-8')
              except (UnicodeDecodeError,OSError): continue
              for c in codes:
                  if chr(c) in text: bad.append(f'{p}: literal U+{c:04X}')
              lowtext = text.lower()
              for token in ('&ndash;','&mdash;','&#8211;','&#8212;','&#x2013;','&#x2014;'):
                  if token in lowtext: bad.append(f'{p}: encoded {token}')
              for i,line in enumerate(text.splitlines(),1):
                  for c in codes:
                      if (f'\\u{c:04x}' in line or f'\\u{c:04X}' in line) and not preserve(p,line):
                          bad.append(f'{p}:{i}: renderable escaped U+{c:04X}')
          if bad:
              print('\n'.join(bad)); raise SystemExit(1)

      - name: Commit cleanup against latest main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No long-dash cleanup changes were needed.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Remove long dashes across portfolio content'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
