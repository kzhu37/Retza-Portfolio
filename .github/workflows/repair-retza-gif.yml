name: Repair Retza Show Me GIF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-retza-gif.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify GIF
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib
          import struct
          import subprocess

          source_commit = "99bb9471301410ef43f8ed5b2e901e4073e34e7f"
          target_sha256 = "72bda73cd5ff9d50da9dd9266f3a3bbf0eebe7790111b00c39b7142a77372405"

          parts = []
          for i in range(8):
              path = f".media-staging/showme-{i:02d}.b64"
              text = subprocess.check_output(
                  ["git", "show", f"{source_commit}:{path}"], text=True
              ).strip()
              parts.append(text)

          encoded = "".join(parts)
          if len(encoded) != 108060:
              raise SystemExit(f"Unexpected staged base64 length: {len(encoded)}")

          repaired = None
          removed_at = None
          first_len = len(parts[0])

          # The staged source contains one duplicated 4-character base64 quartet
          # in the first chunk. Remove each aligned quartet in turn and accept
          # only the candidate whose SHA-256 matches the verified local GIF.
          for pos in range(0, first_len - 3, 4):
              candidate = encoded[:pos] + encoded[pos + 4:]
              try:
                  data = base64.b64decode(candidate, validate=True)
              except Exception:
                  continue
              if hashlib.sha256(data).hexdigest() == target_sha256:
                  repaired = data
                  removed_at = pos
                  break

          if repaired is None:
              raise SystemExit("Could not reconstruct the verified Show Me GIF")

          if repaired[:6] not in (b"GIF87a", b"GIF89a"):
              raise SystemExit("Reconstructed file is not a GIF")
          width, height = struct.unpack("<HH", repaired[6:10])
          if (width, height) != (420, 349):
              raise SystemExit(f"Unexpected GIF dimensions: {width}x{height}")
          if len(repaired) != 81040:
              raise SystemExit(f"Unexpected GIF size: {len(repaired)}")

          out = pathlib.Path("docs/assets/retza-show-me.gif")
          out.write_bytes(repaired)
          print(f"Repaired GIF at base64 offset {removed_at}; {width}x{height}; {len(repaired)} bytes")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/retza-show-me.gif
          git rm .github/workflows/repair-retza-gif.yml
          git commit -m "Fix Retza Show Me GIF rendering"
          git push
