name: Diagnose Retza media chunks

on:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chunks
        shell: bash
        run: |
          set +e
          for f in .media-staging/showme-*.b64 .media-staging/walk-*.b64; do
            printf '%s bytes=%s head=' "$f" "$(wc -c < "$f")"
            head -c 12 "$f"
            printf ' tail='
            tail -c 16 "$f"
            printf ' decode='
            base64 --decode "$f" >/dev/null 2>&1
            echo "$?"
          done
