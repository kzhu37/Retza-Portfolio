name: Clean canonical Vercel URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-canonical-url.yml'

permissions:
  contents: write

jobs:
  clean-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace account-suffixed Retza URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          pattern = re.compile(r'https://retza(?:-[a-z0-9]+)*-xiangseanzhu-7370\.vercel\.app')
          new = 'https://retza-live-demo.vercel.app'
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          changed = []
          for name in filter(None, files):
              path = Path(name)
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              updated = pattern.sub(new, text)
              if updated != text:
                  path.write_text(updated)
                  changed.append(name)
          print('Updated:', *changed, sep='\n- ')
          PY
      - name: Commit canonical URL cleanup
        run: |
          if git diff --quiet; then
            echo 'No URL references needed changing.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use clean Retza production URL'
          git push
