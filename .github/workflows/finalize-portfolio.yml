name: Finalize Retza portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize final media and README
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          cat .media-staging/showme-*.b64 | tr -d '\n\r' | base64 --decode > docs/assets/retza-show-me.gif
          cat .media-staging/walk-*.b64 | tr -d '\n\r' | base64 --decode > docs/assets/retza-walkthrough.webp

          gif_header="$(head -c 6 docs/assets/retza-show-me.gif)"
          test "$gif_header" = "GIF89a" -o "$gif_header" = "GIF87a"
          test "$(head -c 4 docs/assets/retza-walkthrough.webp)" = "RIFF"
          test "$(dd if=docs/assets/retza-walkthrough.webp bs=1 skip=8 count=4 2>/dev/null)" = "WEBP"
          test -s docs/assets/retza-show-me.gif
          test -s docs/assets/retza-walkthrough.webp

          python scripts/finalize_portfolio.py

          rm -rf .media-staging
          rm -f scripts/finalize_portfolio.py
          rm -f .github/workflows/materialize-portfolio-media.yml
          rm -f .github/workflows/finalize-portfolio.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish admissions-ready Retza portfolio presentation"
          git push origin HEAD:main
