name: Neutralize presentation framing

on:
  push:
    paths:
      - .github/workflows/scrub-presentation-framing.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portfolio wording
        shell: python
        run: |
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "The original presentation described this process as **iterative empathy**: watch what users actually do, find the assumptions hidden inside the interface, and change the system around the failure rather than blaming the user.",
                  "We described this process as **iterative empathy**: watch what users actually do, find the assumptions hidden inside the interface, and change the system around the failure rather than blaming the user.",
              ),
              (
                  "The project was collaborative across user research, accessibility problem framing, interface design, testing, AI behavior, implementation, iteration, and presentation.",
                  "The project was collaborative across user research, accessibility problem framing, interface design, testing, AI behavior, implementation, iteration, and project communication.",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected text not found: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
      - name: Commit wording update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Use neutral project framing in portfolio"
          git push
