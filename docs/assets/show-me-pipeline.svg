<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc"><title id="title">Retza Show Me pipeline</title><desc id="desc">A sequence from semantic target generation to validation, Windows UI Automation, candidate scoring, coordinate conversion, revalidation, and overlay rendering.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs><rect width="1600" height="460" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="70" y="66" fill="#f8fafc" font-size="36" font-weight="800">Show Me: evidence before coordinates</text><text x="70" y="100" fill="#94a3b8" font-size="18">The AI describes the target. Trusted Windows logic decides whether it is safe to highlight.</text><g font-size="16" text-anchor="middle"><g transform="translate(65 155)"><rect width="190" height="150" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/><circle cx="95" cy="40" r="21" fill="#f97316"/><text x="95" y="46" fill="#fff" font-size="16" font-weight="800">1</text><text x="95" y="82" fill="#f8fafc" font-weight="750">Semantic target</text><text x="95" y="108" fill="#94a3b8" font-size="13">name · role · app</text><text x="95" y="129" fill="#94a3b8" font-size="13">window · action</text></g><g transform="translate(290 155)"><rect width="190" height="150" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/><circle cx="95" cy="40" r="21" fill="#f97316"/><text x="95" y="46" fill="#fff" font-size="16" font-weight="800">2</text><text x="95" y="82" fill="#f8fafc" font-weight="750">Runtime validation</text><text x="95" y="108" fill="#94a3b8" font-size="13">supported fields</text><text x="95" y="129" fill="#94a3b8" font-size="13">bounded values</text></g><g transform="translate(515 155)"><rect width="190" height="150" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/><circle cx="95" cy="40" r="21" fill="#2dd4bf"/><text x="95" y="46" fill="#0f172a" font-size="16" font-weight="800">3</text><text x="95" y="82" fill="#f8fafc" font-weight="750">Windows UIA</text><text x="95" y="108" fill="#94a3b8" font-size="13">live accessibility</text><text x="95" y="129" fill="#94a3b8" font-size="13">tree evidence</text></g><g transform="translate(740 155)"><rect width="190" height="150" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/><circle cx="95" cy="40" r="21" fill="#2dd4bf"/><text x="95" y="46" fill="#0f172a" font-size="16" font-weight="800">4</text><text x="95" y="82" fill="#f8fafc" font-weight="750">Score candidates</text><text x="95" y="108" fill="#94a3b8" font-size="13">confidence ≥ 0.78</text><text x="95" y="129" fill="#94a3b8" font-size="13">reject ambiguity</text></g><g transform="translate(965 155)"><rect width="190" height="150" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/><circle cx="95" cy="40" r="21" fill="#2dd4bf"/><text x="95" y="46" fill="#0f172a" font-size="16" font-weight="800">5</text><text x="95" y="82" fill="#f8fafc" font-weight="750">Convert geometry</text><text x="95" y="108" fill="#94a3b8" font-size="13">physical pixels</text><text x="95" y="129" fill="#94a3b8" font-size="13">to Electron DIP</text></g><g transform="translate(1190 155)"><rect width="190" height="150" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/><circle cx="95" cy="40" r="21" fill="#f97316"/><text x="95" y="46" fill="#fff" font-size="16" font-weight="800">6</text><text x="95" y="82" fill="#f8fafc" font-weight="750">Revalidate</text><text x="95" y="108" fill="#94a3b8" font-size="13">same window</text><text x="95" y="129" fill="#94a3b8" font-size="13">fresh bounds</text></g><g transform="translate(1415 155)"><rect width="120" height="150" rx="22" fill="url(#accent)"/><circle cx="60" cy="40" r="21" fill="#fff" opacity="0.22"/><text x="60" y="46" fill="#fff" font-size="16" font-weight="800">7</text><text x="60" y="82" fill="#fff" font-weight="800">Show</text><text x="60" y="107" fill="#fff" font-size="13">fox +</text><text x="60" y="127" fill="#fff" font-size="13">spotlight</text></g></g><g stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M258 230 H282"/><path d="M273 222 L283 230 L273 238"/><path d="M483 230 H507"/><path d="M498 222 L508 230 L498 238"/><path d="M708 230 H732"/><path d="M723 222 L733 230 L723 238"/><path d="M933 230 H957"/><path d="M948 222 L958 230 L948 238"/><path d="M1158 230 H1182"/><path d="M1173 222 L1183 230 L1173 238"/><path d="M1383 230 H1407"/><path d="M1398 222 L1408 230 L1398 238"/></g><rect x="390" y="344" width="820" height="64" rx="18" fill="#111827" stroke="#334155"/><circle cx="425" cy="376" r="9" fill="#22c55e"/><text x="450" y="383" fill="#e2e8f0" font-size="17" font-weight="650">Fail closed: hidden, disabled, occluded, ambiguous, stale, or mostly off-screen targets are not highlighted.</text></g></svg>