<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Retza Show Me pipeline</title>
  <desc id="desc">Six stages show semantic target generation, validation, Windows UI Automation evidence, candidate checks, revalidation, and visual guidance.</desc>
  <rect width="1280" height="430" rx="28" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="58" y="62" fill="#f8fafc" font-size="34" font-weight="800">Show Me: evidence before coordinates</text>
    <text x="58" y="99" fill="#cbd5e1" font-size="19">The model describes the target. Trusted Windows logic decides whether it is safe to highlight.</text>

    <g transform="translate(45 145)">
      <rect width="180" height="180" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="30" cy="30" r="18" fill="#f97316"/><text x="30" y="37" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
      <text x="20" y="78" fill="#f8fafc" font-size="20" font-weight="800">Semantic target</text>
      <text x="20" y="116" fill="#cbd5e1" font-size="17">Name, role, app,</text>
      <text x="20" y="143" fill="#cbd5e1" font-size="17">window, action</text>
    </g>

    <g transform="translate(245 145)">
      <rect width="180" height="180" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="30" cy="30" r="18" fill="#f97316"/><text x="30" y="37" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">2</text>
      <text x="20" y="78" fill="#f8fafc" font-size="20" font-weight="800">Validate input</text>
      <text x="20" y="116" fill="#cbd5e1" font-size="17">Supported fields</text>
      <text x="20" y="143" fill="#cbd5e1" font-size="17">and bounded values</text>
    </g>

    <g transform="translate(445 145)">
      <rect width="180" height="180" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="30" cy="30" r="18" fill="#2dd4bf"/><text x="30" y="37" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="900">3</text>
      <text x="20" y="78" fill="#f8fafc" font-size="20" font-weight="800">Windows UIA</text>
      <text x="20" y="116" fill="#cbd5e1" font-size="17">Query the live</text>
      <text x="20" y="143" fill="#cbd5e1" font-size="17">accessibility tree</text>
    </g>

    <g transform="translate(645 145)">
      <rect width="180" height="180" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="30" cy="30" r="18" fill="#2dd4bf"/><text x="30" y="37" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="900">4</text>
      <text x="20" y="78" fill="#f8fafc" font-size="20" font-weight="800">Check evidence</text>
      <text x="20" y="116" fill="#cbd5e1" font-size="17">Reject weak, blocked,</text>
      <text x="20" y="143" fill="#cbd5e1" font-size="17">or ambiguous matches</text>
    </g>

    <g transform="translate(845 145)">
      <rect width="180" height="180" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="30" cy="30" r="18" fill="#f97316"/><text x="30" y="37" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">5</text>
      <text x="20" y="78" fill="#f8fafc" font-size="20" font-weight="800">Revalidate</text>
      <text x="20" y="116" fill="#cbd5e1" font-size="17">Refresh evidence</text>
      <text x="20" y="143" fill="#cbd5e1" font-size="17">and convert geometry</text>
    </g>

    <g transform="translate(1045 145)">
      <rect width="190" height="180" rx="20" fill="#f97316"/>
      <circle cx="30" cy="30" r="18" fill="#fff" opacity="0.22"/><text x="30" y="37" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">6</text>
      <text x="20" y="78" fill="#fff" font-size="20" font-weight="800">Show guidance</text>
      <text x="20" y="116" fill="#fff" font-size="17">Fox and spotlight</text>
      <text x="20" y="143" fill="#fff" font-size="17">on trusted bounds</text>
    </g>

    <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M228 235 H240"/><path d="M428 235 H440"/><path d="M628 235 H640"/><path d="M828 235 H840"/><path d="M1028 235 H1040"/>
    </g>

    <rect x="220" y="358" width="840" height="45" rx="18" fill="#0b1220" stroke="#334155"/>
    <circle cx="250" cy="381" r="7" fill="#22c55e"/>
    <text x="272" y="388" fill="#e2e8f0" font-size="18" font-weight="650">Fail closed: hidden, disabled, ambiguous, occluded, stale, or weak targets are not highlighted.</text>
  </g>
</svg>