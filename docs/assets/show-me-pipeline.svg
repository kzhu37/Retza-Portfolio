<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Retza Show Me pipeline</title>
  <desc id="desc">Six stages show semantic target generation, runtime validation, Windows UI Automation evidence, candidate safety checks, geometry conversion and revalidation, then visual guidance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="440" rx="30" fill="url(#bg)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="70" y="66" fill="#f8fafc" font-size="38" font-weight="800">Show Me: evidence before coordinates</text>
    <text x="70" y="106" fill="#94a3b8" font-size="21">The model describes the target. Trusted Windows logic decides whether it is safe to highlight.</text>

    <g transform="translate(55 160)">
      <rect width="225" height="170" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="34" cy="34" r="19" fill="#f97316"/><text x="34" y="41" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
      <text x="24" y="82" fill="#f8fafc" font-size="22" font-weight="800">Semantic target</text>
      <text x="24" y="116" fill="#94a3b8" font-size="16">Name, role, app,</text>
      <text x="24" y="143" fill="#94a3b8" font-size="16">window, action</text>
    </g>

    <g transform="translate(310 160)">
      <rect width="225" height="170" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="34" cy="34" r="19" fill="#f97316"/><text x="34" y="41" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">2</text>
      <text x="24" y="82" fill="#f8fafc" font-size="22" font-weight="800">Validate input</text>
      <text x="24" y="116" fill="#94a3b8" font-size="16">Supported fields</text>
      <text x="24" y="143" fill="#94a3b8" font-size="16">and bounded values</text>
    </g>

    <g transform="translate(565 160)">
      <rect width="225" height="170" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="34" cy="34" r="19" fill="#2dd4bf"/><text x="34" y="41" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="900">3</text>
      <text x="24" y="82" fill="#f8fafc" font-size="22" font-weight="800">Windows UIA</text>
      <text x="24" y="116" fill="#94a3b8" font-size="16">Query the live</text>
      <text x="24" y="143" fill="#94a3b8" font-size="16">accessibility tree</text>
    </g>

    <g transform="translate(820 160)">
      <rect width="225" height="170" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="34" cy="34" r="19" fill="#2dd4bf"/><text x="34" y="41" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="900">4</text>
      <text x="24" y="82" fill="#f8fafc" font-size="22" font-weight="800">Check candidates</text>
      <text x="24" y="116" fill="#94a3b8" font-size="16">Reject ambiguity,</text>
      <text x="24" y="143" fill="#94a3b8" font-size="16">occlusion, weak matches</text>
    </g>

    <g transform="translate(1075 160)">
      <rect width="225" height="170" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="34" cy="34" r="19" fill="#f97316"/><text x="34" y="41" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">5</text>
      <text x="24" y="82" fill="#f8fafc" font-size="22" font-weight="800">Revalidate</text>
      <text x="24" y="116" fill="#94a3b8" font-size="16">Convert geometry</text>
      <text x="24" y="143" fill="#94a3b8" font-size="16">and refresh evidence</text>
    </g>

    <g transform="translate(1330 160)">
      <rect width="215" height="170" rx="22" fill="url(#accent)"/>
      <circle cx="34" cy="34" r="19" fill="#fff" opacity="0.2"/><text x="34" y="41" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">6</text>
      <text x="24" y="82" fill="#fff" font-size="22" font-weight="800">Show guidance</text>
      <text x="24" y="116" fill="#fff" font-size="16">Fox and spotlight</text>
      <text x="24" y="143" fill="#fff" font-size="16">only on trusted bounds</text>
    </g>

    <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M283 245 H302"/><path d="M293 236 L303 245 L293 254"/>
      <path d="M538 245 H557"/><path d="M548 236 L558 245 L548 254"/>
      <path d="M793 245 H812"/><path d="M803 236 L813 245 L803 254"/>
      <path d="M1048 245 H1067"/><path d="M1058 236 L1068 245 L1058 254"/>
      <path d="M1303 245 H1322"/><path d="M1313 236 L1323 245 L1313 254"/>
    </g>

    <rect x="285" y="365" width="1030" height="48" rx="20" fill="#0b1220" stroke="#334155"/>
    <circle cx="320" cy="389" r="8" fill="#22c55e"/>
    <text x="345" y="396" fill="#e2e8f0" font-size="18" font-weight="650">Fail closed: hidden, disabled, ambiguous, occluded, stale, or insufficiently specific targets are not highlighted.</text>
  </g>
</svg>