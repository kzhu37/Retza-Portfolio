<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" viewBox="0 0 1500 480" role="img" aria-labelledby="title desc"><title id="title">Retza user-driven iteration</title><desc id="desc">The project moves from simpler AI instructions through user testing to the discovery that users still could not find controls, leading to verified visual guidance.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1500" height="480" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="70" y="65" fill="#f8fafc" font-size="36" font-weight="800">Testing changed the product</text><text x="70" y="99" fill="#94a3b8" font-size="18">The strongest feature came from watching where users still struggled after the words were clear.</text><g transform="translate(75 155)"><rect width="260" height="210" rx="24" fill="#172033" stroke="#334155" stroke-width="2"/><text x="28" y="40" fill="#fb923c" font-size="14" font-weight="800">INITIAL IDEA</text><text x="28" y="82" fill="#f8fafc" font-size="22" font-weight="780">Simplify the AI</text><text x="28" y="116" fill="#cbd5e1" font-size="15">Large input, readable text,</text><text x="28" y="142" fill="#cbd5e1" font-size="15">short numbered instructions,</text><text x="28" y="168" fill="#cbd5e1" font-size="15">less jargon.</text></g><g transform="translate(405 155)"><rect width="260" height="210" rx="24" fill="#172033" stroke="#334155" stroke-width="2"/><text x="28" y="40" fill="#2dd4bf" font-size="14" font-weight="800">USER TESTING</text><text x="28" y="82" fill="#f8fafc" font-size="22" font-weight="780">Observe behavior</text><text x="28" y="116" fill="#cbd5e1" font-size="15">Older and younger family</text><text x="28" y="142" fill="#cbd5e1" font-size="15">members exposed assumptions</text><text x="28" y="168" fill="#cbd5e1" font-size="15">the team did not notice.</text></g><g transform="translate(735 155)"><rect width="260" height="210" rx="24" fill="#172033" stroke="#f97316" stroke-width="2"/><text x="28" y="40" fill="#fb923c" font-size="14" font-weight="800">KEY OBSERVATION</text><text x="28" y="82" fill="#f8fafc" font-size="22" font-weight="780">Words were not enough</text><text x="28" y="116" fill="#cbd5e1" font-size="15">Users could understand the</text><text x="28" y="142" fill="#cbd5e1" font-size="15">instruction and still fail to</text><text x="28" y="168" fill="#cbd5e1" font-size="15">locate the control.</text></g><g transform="translate(1065 155)"><rect width="360" height="210" rx="24" fill="#172033" stroke="#2dd4bf" stroke-width="2"/><text x="28" y="40" fill="#2dd4bf" font-size="14" font-weight="800">CURRENT DIRECTION</text><text x="28" y="82" fill="#f8fafc" font-size="22" font-weight="780">Guide with evidence</text><text x="28" y="116" fill="#cbd5e1" font-size="15">Step-by-step walkthroughs,</text><text x="28" y="142" fill="#cbd5e1" font-size="15">semantic targets, Windows UIA,</text><text x="28" y="168" fill="#cbd5e1" font-size="15">and revalidated highlights.</text></g><g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M345 260 H395"/><path d="M384 249 L396 260 L384 271"/><path d="M675 260 H725"/><path d="M714 249 L726 260 L714 271"/><path d="M1005 260 H1055"/><path d="M1044 249 L1056 260 L1044 271"/></g><text x="750" y="430" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="650">Iterative empathy: listen to observed behavior, then redesign around the failure.</text></g></svg>