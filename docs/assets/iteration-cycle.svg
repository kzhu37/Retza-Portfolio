<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Retza development progression</title>
  <desc id="desc">Five stages show the project moving from simpler AI language through user testing to verified visual guidance.</desc>
  <rect width="1280" height="500" rx="28" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="58" y="62" fill="#f8fafc" font-size="34" font-weight="800">Testing changed the product</text>
    <text x="58" y="98" fill="#cbd5e1" font-size="19">Each stage exposed a different assumption hidden inside "simple" computer help.</text>

    <g transform="translate(40 150)">
      <rect width="225" height="245" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <text x="20" y="40" fill="#fb923c" font-size="15" font-weight="800">1. INITIAL IDEA</text>
      <text x="20" y="80" fill="#f8fafc" font-size="22" font-weight="800">Simplify the AI</text>
      <text x="20" y="122" fill="#cbd5e1" font-size="17">Readable controls</text>
      <text x="20" y="150" fill="#cbd5e1" font-size="17">and shorter steps.</text>
      <text x="20" y="196" fill="#94a3b8" font-size="16">Assumption: simpler</text>
      <text x="20" y="221" fill="#94a3b8" font-size="16">words were enough.</text>
    </g>

    <g transform="translate(285 150)">
      <rect width="225" height="245" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <text x="20" y="40" fill="#2dd4bf" font-size="15" font-weight="800">2. PROMPT ITERATION</text>
      <text x="20" y="80" fill="#f8fafc" font-size="22" font-weight="800">Make actions explicit</text>
      <text x="20" y="122" fill="#cbd5e1" font-size="17">Define terms.</text>
      <text x="20" y="150" fill="#cbd5e1" font-size="17">Separate actions.</text>
      <text x="20" y="178" fill="#cbd5e1" font-size="17">Reduce assumptions.</text>
    </g>

    <g transform="translate(530 150)">
      <rect width="225" height="245" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <text x="20" y="40" fill="#2dd4bf" font-size="15" font-weight="800">3. USER TESTING</text>
      <text x="20" y="80" fill="#f8fafc" font-size="22" font-weight="800">Observe behavior</text>
      <text x="20" y="122" fill="#cbd5e1" font-size="17">Grandmother testing</text>
      <text x="20" y="150" fill="#cbd5e1" font-size="17">revealed hesitation</text>
      <text x="20" y="178" fill="#cbd5e1" font-size="17">that words could miss.</text>
    </g>

    <g transform="translate(775 150)">
      <rect width="225" height="245" rx="22" fill="#172033" stroke="#f97316" stroke-width="3"/>
      <text x="20" y="40" fill="#fb923c" font-size="15" font-weight="800">4. KEY OBSERVATION</text>
      <text x="20" y="80" fill="#f8fafc" font-size="22" font-weight="800">Words were not enough</text>
      <text x="20" y="122" fill="#cbd5e1" font-size="17">A user could understand</text>
      <text x="20" y="150" fill="#cbd5e1" font-size="17">the instruction but still</text>
      <text x="20" y="178" fill="#cbd5e1" font-size="17">not find the control.</text>
    </g>

    <g transform="translate(1020 150)">
      <rect width="220" height="245" rx="22" fill="#172033" stroke="#2dd4bf" stroke-width="3"/>
      <text x="20" y="40" fill="#2dd4bf" font-size="15" font-weight="800">5. CURRENT DIRECTION</text>
      <text x="20" y="80" fill="#f8fafc" font-size="22" font-weight="800">Guide with evidence</text>
      <text x="20" y="122" fill="#cbd5e1" font-size="17">One-action walkthroughs</text>
      <text x="20" y="150" fill="#cbd5e1" font-size="17">plus verified semantic</text>
      <text x="20" y="178" fill="#cbd5e1" font-size="17">Show Me targets.</text>
    </g>

    <text x="640" y="452" text-anchor="middle" fill="#cbd5e1" font-size="18" font-weight="650">The product moved forward by observing failure, not by assuming technically correct output was enough.</text>
  </g>
</svg>