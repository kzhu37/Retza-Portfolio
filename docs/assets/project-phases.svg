<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="455" viewBox="0 0 1280 455" role="img" aria-labelledby="title desc">
  <title id="title">Retza project phases</title>
  <desc id="desc">The original collaborative project established the user problem and visual-guidance direction. The later repository extends that idea with Windows engineering and verification.</desc>
  <rect width="1280" height="455" rx="28" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="58" y="62" fill="#f8fafc" font-size="34" font-weight="800">One problem, two development phases</text>
    <text x="58" y="98" fill="#cbd5e1" font-size="19">The later repository extends the original user-tested concept without rewriting its authorship.</text>

    <g transform="translate(55 140)">
      <rect width="500" height="245" rx="24" fill="#172033" stroke="#f97316" stroke-width="3"/>
      <text x="28" y="42" fill="#fb923c" font-size="16" font-weight="800">LATE APRIL TO MID-MAY 2026</text>
      <text x="28" y="83" fill="#f8fafc" font-size="25" font-weight="800">Original collaborative project</text>
      <g fill="#cbd5e1" font-size="18">
        <text x="35" y="128">• Define the accessibility problem and audience</text>
        <text x="35" y="164">• Replace dense help with focused guidance</text>
        <text x="35" y="200">• Test with family users and observe hesitation</text>
        <text x="35" y="236">• Develop the visual-guidance direction</text>
      </g>
    </g>

    <g transform="translate(725 140)">
      <rect width="500" height="245" rx="24" fill="#172033" stroke="#2dd4bf" stroke-width="3"/>
      <text x="28" y="42" fill="#2dd4bf" font-size="16" font-weight="800">LATER REPOSITORY PHASE</text>
      <text x="28" y="83" fill="#f8fafc" font-size="25" font-weight="800">Windows engineering extension</text>
      <g fill="#cbd5e1" font-size="18">
        <text x="35" y="128">• Build the Windows-first Electron architecture</text>
        <text x="35" y="164">• Resolve live UI Automation targets</text>
        <text x="35" y="200">• Add revalidation, DPI geometry, and safeguards</text>
        <text x="35" y="236">• Add automated verification and browser adaptation</text>
      </g>
    </g>

    <g stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M580 262 H700"/>
    </g>
    <text x="640" y="422" text-anchor="middle" fill="#cbd5e1" font-size="18">Same principle across both phases: help should increase actionable confidence.</text>
  </g>
</svg>