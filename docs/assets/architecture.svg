<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">Retza architecture and trust boundaries</title>
  <desc id="desc">The React renderer connects through a restricted preload bridge to a trusted Electron main process, which validates AI output and owns Windows integration.</desc>
  <rect width="1280" height="660" rx="28" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="58" y="62" fill="#f8fafc" font-size="34" font-weight="800">Architecture: powerful actions stay behind trusted boundaries</text>
    <text x="58" y="98" fill="#cbd5e1" font-size="19">The renderer does not receive credentials or direct operating-system inspection access.</text>

    <rect x="60" y="145" width="260" height="390" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="88" y="188" fill="#fb923c" font-size="17" font-weight="800">RENDERER</text>
    <text x="88" y="225" fill="#f8fafc" font-size="25" font-weight="800">React interface</text>
    <g fill="#cbd5e1" font-size="18">
      <text x="92" y="278">• Chat and walkthroughs</text>
      <text x="92" y="316">• Accessibility settings</text>
      <text x="92" y="354">• Speech input</text>
      <text x="92" y="392">• Fox companion</text>
      <text x="92" y="430">• Show Me presentation</text>
    </g>
    <rect x="88" y="468" width="204" height="44" rx="13" fill="#172033" stroke="#475569"/>
    <text x="190" y="496" text-anchor="middle" fill="#cbd5e1" font-size="15">No unrestricted Node access</text>

    <rect x="365" y="245" width="185" height="180" rx="22" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="458" y="288" text-anchor="middle" fill="#fb923c" font-size="17" font-weight="800">PRELOAD</text>
    <text x="458" y="329" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Restricted bridge</text>
    <text x="458" y="368" text-anchor="middle" fill="#cbd5e1" font-size="16">Explicit IPC only</text>
    <text x="458" y="397" text-anchor="middle" fill="#cbd5e1" font-size="16">contextIsolation</text>

    <rect x="600" y="135" width="400" height="420" rx="25" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="630" y="180" fill="#2dd4bf" font-size="17" font-weight="800">TRUSTED MAIN PROCESS</text>
    <text x="630" y="218" fill="#f8fafc" font-size="26" font-weight="800">Electron + Windows integration</text>

    <g font-size="16">
      <rect x="630" y="255" width="160" height="72" rx="15" fill="#172033" stroke="#334155"/>
      <text x="710" y="284" text-anchor="middle" fill="#e2e8f0" font-weight="750">Response parser</text>
      <text x="710" y="308" text-anchor="middle" fill="#cbd5e1" font-size="14">validate AI output</text>

      <rect x="810" y="255" width="160" height="72" rx="15" fill="#172033" stroke="#334155"/>
      <text x="890" y="284" text-anchor="middle" fill="#e2e8f0" font-weight="750">System context</text>
      <text x="890" y="308" text-anchor="middle" fill="#cbd5e1" font-size="14">limited + sanitized</text>

      <rect x="630" y="347" width="160" height="72" rx="15" fill="#172033" stroke="#334155"/>
      <text x="710" y="376" text-anchor="middle" fill="#e2e8f0" font-weight="750">Windows paths</text>
      <text x="710" y="400" text-anchor="middle" fill="#cbd5e1" font-size="14">deterministic tasks</text>

      <rect x="810" y="347" width="160" height="72" rx="15" fill="#172033" stroke="#334155"/>
      <text x="890" y="376" text-anchor="middle" fill="#e2e8f0" font-weight="750">Prerequisites</text>
      <text x="890" y="400" text-anchor="middle" fill="#cbd5e1" font-size="14">repair missing setup</text>

      <rect x="630" y="439" width="160" height="72" rx="15" fill="#172033" stroke="#334155"/>
      <text x="710" y="468" text-anchor="middle" fill="#e2e8f0" font-weight="750">Proactive help</text>
      <text x="710" y="492" text-anchor="middle" fill="#cbd5e1" font-size="14">bounded heuristics</text>

      <rect x="810" y="439" width="160" height="72" rx="15" fill="#172033" stroke="#f97316"/>
      <text x="890" y="468" text-anchor="middle" fill="#f8fafc" font-weight="750">Show Me resolver</text>
      <text x="890" y="492" text-anchor="middle" fill="#fb923c" font-size="14">evidence-backed geometry</text>
    </g>

    <rect x="1045" y="165" width="175" height="145" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="1133" cy="210" r="20" fill="#f97316"/>
    <text x="1133" y="217" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">AI</text>
    <text x="1133" y="252" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Gemini</text>
    <text x="1133" y="282" text-anchor="middle" fill="#cbd5e1" font-size="15">broader guidance</text>

    <rect x="1045" y="365" width="175" height="145" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="1133" cy="410" r="20" fill="#2dd4bf"/>
    <text x="1133" y="417" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="900">OS</text>
    <text x="1133" y="452" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Windows UIA</text>
    <text x="1133" y="482" text-anchor="middle" fill="#cbd5e1" font-size="15">live accessibility tree</text>

    <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M325 335 H355"/><path d="M555 335 H590"/><path d="M1005 240 H1035"/><path d="M1005 440 H1035"/>
    </g>

    <rect x="345" y="585" width="590" height="44" rx="18" fill="#0b1220" stroke="#334155"/>
    <text x="640" y="613" text-anchor="middle" fill="#e2e8f0" font-size="17">Credentials, OS inspection, and target geometry stay outside the renderer.</text>
  </g>
</svg>