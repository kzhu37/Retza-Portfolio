<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Retza architecture and trust boundaries</title><desc id="desc">React renderer connects through a restricted preload bridge to the Electron main process, which contains AI validation, system context, Windows navigation, prerequisite detection, struggle detection, and Show Me resolution.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient></defs><rect width="1500" height="720" rx="30" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="70" y="70" fill="#f8fafc" font-size="38" font-weight="800">Architecture: keep powerful actions behind trusted boundaries</text><text x="70" y="108" fill="#94a3b8" font-size="19">Renderer UI is isolated from credentials and operating-system inspection.</text><rect x="80" y="160" width="350" height="420" rx="26" fill="#111827" stroke="#334155" stroke-width="2"/><text x="110" y="205" fill="#fb923c" font-size="17" font-weight="800">RENDERER</text><text x="110" y="240" fill="#f8fafc" font-size="27" font-weight="800">React interface</text><g fill="#cbd5e1" font-size="17"><text x="125" y="292">• Chat and walkthrough UI</text><text x="125" y="332">• Settings and text size</text><text x="125" y="372">• Speech input</text><text x="125" y="412">• Fox companion</text><text x="125" y="452">• Show Me overlay</text></g><rect x="110" y="500" width="290" height="48" rx="14" fill="#172033" stroke="#475569"/><text x="255" y="530" text-anchor="middle" fill="#94a3b8" font-size="14">No unrestricted Node.js access</text><rect x="485" y="280" width="210" height="170" rx="24" fill="#1e293b" stroke="#f97316" stroke-width="2"/><text x="590" y="322" text-anchor="middle" fill="#fb923c" font-size="16" font-weight="800">PRELOAD</text><text x="590" y="355" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="750">Restricted bridge</text><text x="590" y="388" text-anchor="middle" fill="#94a3b8" font-size="14">Explicit IPC methods only</text><text x="590" y="414" text-anchor="middle" fill="#94a3b8" font-size="14">contextIsolation enabled</text><rect x="750" y="140" width="440" height="480" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/><text x="785" y="185" fill="#2dd4bf" font-size="17" font-weight="800">TRUSTED MAIN PROCESS</text><text x="785" y="222" fill="#f8fafc" font-size="28" font-weight="800">Electron + OS integration</text><g font-size="16"><rect x="785" y="265" width="170" height="70" rx="16" fill="#172033" stroke="#334155"/><text x="870" y="294" text-anchor="middle" fill="#e2e8f0" font-weight="700">Response parser</text><text x="870" y="317" text-anchor="middle" fill="#94a3b8" font-size="13">validate AI output</text><rect x="975" y="265" width="180" height="70" rx="16" fill="#172033" stroke="#334155"/><text x="1065" y="294" text-anchor="middle" fill="#e2e8f0" font-weight="700">System context</text><text x="1065" y="317" text-anchor="middle" fill="#94a3b8" font-size="13">limited + sanitized</text><rect x="785" y="355" width="170" height="70" rx="16" fill="#172033" stroke="#334155"/><text x="870" y="384" text-anchor="middle" fill="#e2e8f0" font-weight="700">Windows knowledge</text><text x="870" y="407" text-anchor="middle" fill="#94a3b8" font-size="13">deterministic paths</text><rect x="975" y="355" width="180" height="70" rx="16" fill="#172033" stroke="#334155"/><text x="1065" y="384" text-anchor="middle" fill="#e2e8f0" font-weight="700">Prerequisites</text><text x="1065" y="407" text-anchor="middle" fill="#94a3b8" font-size="13">repair missing setup</text><rect x="785" y="445" width="170" height="70" rx="16" fill="#172033" stroke="#334155"/><text x="870" y="474" text-anchor="middle" fill="#e2e8f0" font-weight="700">Struggle detector</text><text x="870" y="497" text-anchor="middle" fill="#94a3b8" font-size="13">interaction heuristics</text><rect x="975" y="445" width="180" height="70" rx="16" fill="#172033" stroke="#f97316"/><text x="1065" y="474" text-anchor="middle" fill="#f8fafc" font-weight="700">Show Me resolver</text><text x="1065" y="497" text-anchor="middle" fill="#fb923c" font-size="13">evidence-backed geometry</text></g><rect x="1245" y="170" width="185" height="160" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/><circle cx="1338" cy="218" r="20" fill="#f97316"/><text x="1338" y="225" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">AI</text><text x="1338" y="262" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="750">Gemini</text><text x="1338" y="291" text-anchor="middle" fill="#94a3b8" font-size="13">broader guidance</text><rect x="1245" y="390" width="185" height="160" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/><circle cx="1338" cy="438" r="20" fill="#2dd4bf"/><text x="1338" y="445" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="900">OS</text><text x="1338" y="482" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="750">Windows UIA</text><text x="1338" y="511" text-anchor="middle" fill="#94a3b8" font-size="13">live accessibility tree</text><g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M440 365 H475"/><path d="M465 355 L476 365 L465 375"/><path d="M705 365 H740"/><path d="M730 355 L741 365 L730 375"/><path d="M1198 255 H1234"/><path d="M1224 245 L1235 255 L1224 265"/><path d="M1198 470 H1234"/><path d="M1224 460 L1235 470 L1224 480"/></g><rect x="530" y="645" width="450" height="42" rx="21" fill="#0b1220" stroke="#334155"/><text x="755" y="672" text-anchor="middle" fill="#cbd5e1" font-size="14">Credentials, OS inspection, and target geometry stay outside the renderer.</text></g></svg>