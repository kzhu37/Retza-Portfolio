<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Retza struggle-detection heuristics</title>
  <desc id="desc">Three conservative interaction signals flow downward into a possible-struggle decision that offers help with a cooldown and user pause control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1500" height="650" rx="28" fill="url(#bg)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="70" y="65" fill="#f8fafc" font-size="36" font-weight="800">Proactive help, not emotion detection</text>
    <text x="70" y="99" fill="#94a3b8" font-size="18">Retza watches for interaction patterns that may justify offering help, then waits before prompting again.</text>

    <g transform="translate(80 150)">
      <rect width="340" height="170" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="52" cy="48" r="20" fill="#f97316"/>
      <text x="52" y="55" text-anchor="middle" fill="#fff" font-size="17" font-weight="850">45</text>
      <text x="92" y="45" fill="#f8fafc" font-size="20" font-weight="750">Inactivity</text>
      <text x="92" y="69" fill="#94a3b8" font-size="13">about 45 seconds</text>
      <text x="30" y="120" fill="#cbd5e1" font-size="14">No recent mouse or keyboard</text>
      <text x="30" y="144" fill="#cbd5e1" font-size="14">activity.</text>
    </g>

    <g transform="translate(580 150)">
      <rect width="340" height="170" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="52" cy="48" r="20" fill="#2dd4bf"/>
      <text x="52" y="55" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="900">3×</text>
      <text x="92" y="45" fill="#f8fafc" font-size="20" font-weight="750">Repeated clicks</text>
      <text x="92" y="69" fill="#94a3b8" font-size="13">3 clicks / 2 s / 60 px</text>
      <text x="30" y="120" fill="#cbd5e1" font-size="14">Repeated attempts in nearly</text>
      <text x="30" y="144" fill="#cbd5e1" font-size="14">the same place.</text>
    </g>

    <g transform="translate(1080 150)">
      <rect width="340" height="170" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
      <circle cx="52" cy="48" r="20" fill="#f97316"/>
      <text x="52" y="55" text-anchor="middle" fill="#fff" font-size="17" font-weight="850">8s</text>
      <text x="92" y="45" fill="#f8fafc" font-size="20" font-weight="750">Long hover</text>
      <text x="92" y="69" fill="#94a3b8" font-size="13">about 8 s / 30 px region</text>
      <text x="30" y="120" fill="#cbd5e1" font-size="14">Cursor stays around one area</text>
      <text x="30" y="144" fill="#cbd5e1" font-size="14">without a clear next action.</text>
    </g>

    <g stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M250 325 C250 365 520 365 620 405"/>
      <path d="M750 325 L750 405"/>
      <path d="M1250 325 C1250 365 980 365 880 405"/>
    </g>

    <g transform="translate(510 420)">
      <rect width="480" height="145" rx="24" fill="#111827" stroke="#f97316" stroke-width="2"/>
      <text x="240" y="36" text-anchor="middle" fill="#fb923c" font-size="15" font-weight="850">POSSIBLE STRUGGLE</text>
      <text x="240" y="72" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="780">Offer help</text>
      <text x="240" y="104" text-anchor="middle" fill="#cbd5e1" font-size="14">User can pause Watching</text>
      <text x="240" y="128" text-anchor="middle" fill="#cbd5e1" font-size="14">120 second cooldown</text>
    </g>

    <rect x="390" y="592" width="720" height="38" rx="19" fill="#0b1220" stroke="#334155"/>
    <text x="750" y="617" text-anchor="middle" fill="#94a3b8" font-size="14">Heuristics suggest an opportunity to help. They do not claim to identify frustration with certainty.</text>
  </g>
</svg>