<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="450" viewBox="0 0 1500 450" role="img" aria-labelledby="title desc"><title id="title">Retza struggle-detection heuristics</title><desc id="desc">Three conservative interaction signals feed a proactive help decision with a cooldown and user pause control.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient></defs><rect width="1500" height="450" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="70" y="65" fill="#f8fafc" font-size="36" font-weight="800">Proactive help, not emotion detection</text><text x="70" y="99" fill="#94a3b8" font-size="18">Retza watches for interaction patterns that may justify offering help, then waits before prompting again.</text><g transform="translate(75 155)"><rect width="260" height="150" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/><circle cx="48" cy="46" r="20" fill="#f97316"/><text x="48" y="53" text-anchor="middle" fill="#fff" font-size="17" font-weight="850">45</text><text x="85" y="43" fill="#f8fafc" font-size="20" font-weight="750">Inactivity</text><text x="85" y="66" fill="#94a3b8" font-size="13">about 45 seconds</text><text x="28" y="112" fill="#cbd5e1" font-size="14">No recent mouse or keyboard</text><text x="28" y="134" fill="#cbd5e1" font-size="14">activity.</text></g><g transform="translate(385 155)"><rect width="280" height="150" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/><circle cx="48" cy="46" r="20" fill="#2dd4bf"/><text x="48" y="53" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="900">3×</text><text x="85" y="43" fill="#f8fafc" font-size="20" font-weight="750">Repeated clicks</text><text x="85" y="66" fill="#94a3b8" font-size="13">3 clicks / 2 s / 60 px</text><text x="28" y="112" fill="#cbd5e1" font-size="14">Repeated attempts in nearly</text><text x="28" y="134" fill="#cbd5e1" font-size="14">the same place.</text></g><g transform="translate(715 155)"><rect width="280" height="150" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/><circle cx="48" cy="46" r="20" fill="#f97316"/><text x="48" y="53" text-anchor="middle" fill="#fff" font-size="17" font-weight="850">8s</text><text x="85" y="43" fill="#f8fafc" font-size="20" font-weight="750">Long hover</text><text x="85" y="66" fill="#94a3b8" font-size="13">about 8 s / 30 px region</text><text x="28" y="112" fill="#cbd5e1" font-size="14">Cursor stays around one area</text><text x="28" y="134" fill="#cbd5e1" font-size="14">without a clear next action.</text></g><g transform="translate(1085 142)"><rect width="335" height="176" rx="24" fill="#111827" stroke="#f97316" stroke-width="2"/><text x="167" y="43" text-anchor="middle" fill="#fb923c" font-size="15" font-weight="850">POSSIBLE STRUGGLE</text><text x="167" y="81" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="780">Offer help</text><text x="167" y="112" text-anchor="middle" fill="#cbd5e1" font-size="14">User can pause Watching</text><text x="167" y="138" text-anchor="middle" fill="#cbd5e1" font-size="14">120 second cooldown</text></g><g stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M345 230 C420 230 980 205 1070 205"/><path d="M675 230 C760 230 995 230 1070 230"/><path d="M1005 230 C1030 230 1048 255 1070 255"/><path d="M1058 197 L1071 205 L1058 214"/><path d="M1058 222 L1071 230 L1058 238"/><path d="M1058 247 L1071 255 L1058 264"/></g><rect x="440" y="365" width="620" height="42" rx="21" fill="#0b1220" stroke="#334155"/><text x="750" y="392" text-anchor="middle" fill="#94a3b8" font-size="14">Heuristics suggest an opportunity to help. They do not claim to identify frustration with certainty.</text></g></svg>