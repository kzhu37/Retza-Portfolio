<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Retza product flow</title>
  <desc id="desc">An illustrated flow from asking a computer question, to a walkthrough, to a verified Show Me highlight.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1600" height="700" rx="34" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="180" fill="#f97316" opacity="0.06"/>
  <circle cx="120" cy="620" r="210" fill="#2dd4bf" opacity="0.05"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="90" y="88" fill="#f8fafc" font-size="46" font-weight="800">Ask. Walk through. Verify. Show.</text>
    <text x="90" y="128" fill="#94a3b8" font-size="22">Retza combines plain-language guidance with evidence-backed Windows UI targeting.</text>
    <g filter="url(#shadow)">
      <rect x="90" y="180" width="420" height="430" rx="28" fill="#111c31" stroke="#334155" stroke-width="2"/>
      <rect x="590" y="180" width="420" height="430" rx="28" fill="#111c31" stroke="#334155" stroke-width="2"/>
      <rect x="1090" y="180" width="420" height="430" rx="28" fill="#111c31" stroke="#334155" stroke-width="2"/>
    </g>
    <g>
      <circle cx="135" cy="225" r="20" fill="url(#orange)"/>
      <path d="M125 218 L130 208 L135 216 L140 208 L145 218 L142 232 Q135 239 128 232 Z" fill="#fff" opacity="0.92"/>
      <text x="168" y="233" fill="#f8fafc" font-size="26" font-weight="750">1. Ask</text>
      <text x="125" y="276" fill="#94a3b8" font-size="17">A computer question enters Retza.</text>
      <rect x="135" y="330" width="310" height="76" rx="22" fill="#1d4ed8"/>
      <text x="160" y="360" fill="#eff6ff" font-size="17" font-weight="650">Where is Bluetooth?</text>
      <text x="160" y="386" fill="#bfdbfe" font-size="14">You</text>
      <rect x="135" y="430" width="310" height="106" rx="22" fill="#1e293b" stroke="#334155"/>
      <text x="160" y="462" fill="#e2e8f0" font-size="16" font-weight="650">I can guide you step by step.</text>
      <text x="160" y="490" fill="#cbd5e1" font-size="15">First, open Start.</text>
      <rect x="160" y="506" width="104" height="22" rx="11" fill="#f97316" opacity="0.18"/>
      <text x="177" y="522" fill="#fb923c" font-size="12" font-weight="700">Show me</text>
    </g>
    <g>
      <circle cx="635" cy="225" r="20" fill="#2dd4bf"/>
      <text x="668" y="233" fill="#f8fafc" font-size="26" font-weight="750">2. Walkthrough</text>
      <text x="625" y="276" fill="#94a3b8" font-size="17">One focused action at a time.</text>
      <text x="635" y="326" fill="#64748b" font-size="14" font-weight="700">PLAN · 2 STEPS</text>
      <circle cx="651" cy="370" r="16" fill="#f97316" opacity="0.18" stroke="#f97316"/>
      <text x="646" y="376" fill="#fb923c" font-size="13" font-weight="800">1</text>
      <text x="684" y="368" fill="#e2e8f0" font-size="17" font-weight="650">Open Start</text>
      <text x="684" y="392" fill="#94a3b8" font-size="14">Setup step</text>
      <circle cx="651" cy="438" r="16" fill="#1e293b" stroke="#475569"/>
      <text x="646" y="444" fill="#94a3b8" font-size="13" font-weight="800">2</text>
      <text x="684" y="436" fill="#cbd5e1" font-size="17">Choose Bluetooth &amp; devices</text>
      <text x="684" y="460" fill="#64748b" font-size="14">Windows 11 path</text>
      <rect x="635" y="500" width="215" height="52" rx="26" fill="url(#orange)"/>
      <text x="679" y="533" fill="#fff" font-size="16" font-weight="750">Start Walkthrough</text>
    </g>
    <g>
      <circle cx="1135" cy="225" r="20" fill="#f97316"/>
      <text x="1168" y="233" fill="#f8fafc" font-size="26" font-weight="750">3. Show Me</text>
      <text x="1125" y="276" fill="#94a3b8" font-size="17">Highlight only after live verification.</text>
      <rect x="1135" y="320" width="330" height="200" rx="20" fill="#dbeafe"/>
      <rect x="1135" y="482" width="330" height="38" fill="#111827"/>
      <circle cx="1170" cy="501" r="12" fill="#2563eb"/>
      <rect x="1164" y="495" width="12" height="12" fill="#fff" opacity="0.92"/>
      <rect x="1202" y="491" width="28" height="20" rx="5" fill="#334155"/>
      <rect x="1242" y="491" width="28" height="20" rx="5" fill="#334155"/>
      <rect x="1147" y="478" width="46" height="46" rx="12" fill="none" stroke="#fff" stroke-width="4"/>
      <rect x="1142" y="473" width="56" height="56" rx="15" fill="none" stroke="#f97316" stroke-width="6"/>
      <circle cx="1170" cy="501" r="38" fill="#f97316" opacity="0.12"/>
      <rect x="1210" y="342" width="225" height="92" rx="16" fill="#fff" stroke="#fed7aa"/>
      <text x="1229" y="371" fill="#ea580c" font-size="12" font-weight="800">STEP 1 OF 2</text>
      <text x="1229" y="398" fill="#172033" font-size="16" font-weight="750">Click Start</text>
      <text x="1229" y="421" fill="#64748b" font-size="12">Verified before display</text>
      <rect x="1135" y="548" width="330" height="32" rx="16" fill="#0b1220" stroke="#334155"/>
      <circle cx="1156" cy="564" r="6" fill="#22c55e"/>
      <text x="1173" y="570" fill="#cbd5e1" font-size="13">Windows UI Automation evidence</text>
    </g>
    <path d="M530 395 H565" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M554 384 L566 395 L554 406" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1030 395 H1065" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M1054 384 L1066 395 L1054 406" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
